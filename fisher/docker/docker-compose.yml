# 在本目录执行：docker compose up -d --build
# 或：docker compose -f docker/docker-compose.yml --project-directory docker up -d --build（从 fisher/）

services:
  db:
    image: mysql:8.0
    container_name: fisher-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: fisher
      MYSQL_USER: fisher
      MYSQL_PASSWORD: fisherpass
    ports:
      - "3307:3306"   # 宿主机 3307，避免和本机 MySQL 3306 冲突
    volumes:
      - fisher_mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: fisher-redis
    ports:
      - "6380:6379"   # 宿主机 6380，避免和本机 Redis 冲突
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..                    # fisher/：代码、requirements、alembic
      dockerfile: docker/Dockerfile  # 相对 context
    image: fisher-app-1:local
    container_name: fisher-app-1
    ports:
      - "8000:8000"
    # env_file：将 .env.docker 中的环境变量导入到容器中
    env_file:
      - .env.docker                  # 相对本 compose 文件：docker/.env.docker
    # depends_on，等 db、redis 健康后再启动 app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 健康检查接口在 P2.3 再加

# volume 的作用是：容器可以重建、升级、重启，数据库数据仍然保留。
volumes:
  fisher_mysql_data:
